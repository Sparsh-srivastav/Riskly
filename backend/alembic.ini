# Riskly database migration configuration

[alembic]

# Path to migration scripts
script_location = %(here)s/migrations

# Template used to generate migration filenames
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Python module search path
prepend_sys_path = .

# Timezone used for migration timestamps
# Leave empty to use local time
# timezone =

# Maximum length of migration slug
# truncate_slug_length = 40

# Run env.py during revision even without autogenerate
# revision_environment = false

# Allow .pyc/.pyo files without source .py files
# sourceless = false

# Migration version locations
# version_locations = %(here)s/migrations/versions

# Path separator for list values
path_separator = os

# Search version directories recursively
# recursive_version_locations = false

# Encoding used for generated migration files
# output_encoding = utf-8


# IMPORTANT:
# Database URL is provided by app/core/config.py through env.py.
# Do not place database credentials here.
sqlalchemy.url =


[post_write_hooks]

# Optional code formatting/linting hooks
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Optional Ruff hook
# hooks = ruff
# ruff.type = module
# ruff.module = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME


# Logging configuration

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers = console
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S